services:
  - type: web
    name: miqyas-exams
    runtime: node
    plan: starter
    branch: server-edition
    buildCommand: node --check server.mjs
    startCommand: node server.mjs
    healthCheckPath: /health
    disk:
      name: miqyas-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/miqyas.sqlite
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
