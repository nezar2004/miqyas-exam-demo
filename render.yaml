services:
  - type: web
    name: miqyas-exams
    runtime: node
    plan: free
    branch: server-edition
    buildCommand: npm --prefix firebase-backend install --omit=dev
    startCommand: npm --prefix firebase-backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
